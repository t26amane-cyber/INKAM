<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#050817">

    <title>INKAM</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- APP -->
    <div class="app">

        <!-- HEADER -->
        <header class="app-header">
            <div class="brand">
                <div class="brand-logo">IN</div>

                <div>
                    <h1>INKAM</h1>
                    <span>Earn • Task • Grow</span>
                </div>
            </div>

            <button class="notification-btn" type="button">
                🔔
            </button>
        </header>


        <!-- HOME -->
        <main id="homePage">

            <!-- BALANCE CARD -->
            <section class="balance-card">

                <div class="balance-top">
                    <span>Your Balance</span>
                    <span>৳</span>
                </div>

                <h2>৳ 0.00</h2>

                <div class="balance-info">
                    <div>
                        <small>Tasks</small>
                        <strong>0</strong>
                    </div>

                    <div>
                        <small>Referrals</small>
                        <strong>0</strong>
                    </div>

                    <div>
                        <small>Today Earn</small>
                        <strong>৳0.00</strong>
                    </div>
                </div>

            </section>


            <!-- QUICK ACTIONS -->
            <section class="quick-grid">

                <button class="action-card" type="button">
                    <div class="action-icon">🎯</div>
                    <span>Earn Money</span>
                </button>

                <button class="action-card" type="button">
                    <div class="action-icon">🎁</div>
                    <span>Daily Bonus</span>
                </button>

                <button class="action-card" type="button">
                    <div class="action-icon">👥</div>
                    <span>Refer & Earn</span>
                </button>

                <button class="action-card" type="button">
                    <div class="action-icon">💸</div>
                    <span>Withdraw</span>
                </button>

                <button class="action-card" type="button">
                    <div class="action-icon">📜</div>
                    <span>History</span>
                </button>

                <button class="action-card" type="button">
                    <div class="action-icon">👤</div>
                    <span>Profile</span>
                </button>

            </section>


            <!-- EARNING SECTION -->
            <section class="section">

                <div class="section-title">
                    <h3>Start Earning</h3>
                    <span>›</span>
                </div>

                <div class="earning-card">

                    <div class="earning-icon">🚀</div>

                    <div class="earning-content">
                        <h4>Complete Tasks</h4>
                        <p>Complete simple tasks and earn coins.</p>
                    </div>

                    <button type="button">
                        Start
                    </button>

                </div>

            </section>


            <!-- RECENT ACTIVITY -->
            <section class="section">

                <div class="section-title">
                    <h3>Recent Activity</h3>
                </div>

                <div class="empty-state">
                    <div>📊</div>
                    <p>No earning activity yet</p>
                    <small>Complete your first task to start earning.</small>
                </div>

            </section>

        </main>


        <!-- BOTTOM NAVIGATION -->
        <nav class="bottom-nav">

            <button class="nav-item active" type="button">
                <span>⌂</span>
                <small>Home</small>
            </button>

            <button class="nav-item" type="button">
                <span>🎯</span>
                <small>Tasks</small>
            </button>

            <button class="nav-item" type="button">
                <span>🎁</span>
                <small>Bonus</small>
            </button>

            <button class="nav-item" type="button">
                <span>👥</span>
                <small>Referral</small>
            </button>

            <button class="nav-item" type="button">
                <span>👤</span>
                <small>Profile</small>
            </button>

        </nav>

    </div>


    <!-- TELEGRAM MINI APP -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- MAIN SCRIPT -->
    <script src="script.js"></script>

</body>
</html>
